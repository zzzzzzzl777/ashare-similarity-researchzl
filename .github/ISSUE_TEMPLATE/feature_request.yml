name: Feature Request
description: 提出对当前项目有帮助的产品或工程改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请尽量把建议落在当前项目真实范围内：本地单机工具、免费数据回填、索引构建、搜索体验、Web 交付、文档和可观测性。

        如果你的建议更偏未来 SaaS、多租户、公网服务，也欢迎提出，但请明确说明它为什么值得现在讨论。
  - type: dropdown
    id: area
    attributes:
      label: 建议区域
      options:
        - 文档 / GitHub 交付
        - 回填 / 免费数据
        - 索引 / 搜索
        - Web / 导出 / 可用性
        - 运维 / doctor / status
        - 性能 / FAISS / GPU
        - 未来 SaaS / 多用户方向
        - 其他
    validations:
      required: true
  - type: dropdown
    id: fit
    attributes:
      label: 与当前项目的相关程度
      description: 帮助判断是当前迭代项，还是更偏未来路线图
      options:
        - 直接服务当前本地工具
        - 扩展当前维护 / 可观测性能力
        - 更偏未来 SaaS / 多用户能力
        - 我不确定
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 先说清楚问题，而不是只说方案
    validations:
      required: true
  - type: textarea
    id: project_fit
    attributes:
      label: 为什么这对当前项目重要
      description: 请说明它与当前本地工具、免费数据、索引、Web 或交付流程的关系
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望项目怎么改
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 还有哪些可选思路，或者为什么你不建议某些方案
  - type: textarea
    id: diagnostics
    attributes:
      label: 如果与现有行为有关，请补充诊断信息
      description: 可附 `doctor` / `status` 输出、现有命令行为、当前限制说明
      render: shell
  - type: textarea
    id: context
    attributes:
      label: 额外上下文
      description: 可附上示意图、数据样例、使用场景、路线图考虑
