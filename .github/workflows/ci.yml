name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]

      - name: Run tests
        run: python -m pytest -q

      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist

      - name: Smoke test wheel install
        shell: pwsh
        run: |
          python -m venv .venv-smoke
          .\.venv-smoke\Scripts\python -m pip install --upgrade pip
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          .\.venv-smoke\Scripts\python -m pip install $wheel
          .\.venv-smoke\Scripts\ashare-similarity --help
          .\.venv-smoke\Scripts\python -c "from ashare_similarity.app import create_app; create_app()"
