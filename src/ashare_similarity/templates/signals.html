<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>历史回测信号看板</title>
    <link rel="stylesheet" href="/static/styles.css?v={{ static_version }}" />
    <script src="/static/vendor/echarts.min.js?v={{ static_version }}"></script>
    <style>
      .signal-page { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
      .signal-header { margin-bottom: 2rem; }
      .signal-header h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      .signal-header .meta { color: #666; font-size: 0.85rem; }
      .research-badge { display: inline-block; background: #fff3cd; color: #856404; padding: 2px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; margin-left: 8px; }
      .summary-cards { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
      .summary-card { flex: 1; min-width: 280px; background: #f8f9fa; border-radius: 8px; padding: 1rem; border: 1px solid #dee2e6; }
      .summary-card h3 { margin: 0 0 0.5rem; font-size: 0.95rem; }
      .summary-card .stat { font-size: 1.4rem; font-weight: 700; color: #212529; }
      .summary-card .stat-label { font-size: 0.75rem; color: #6c757d; }
      .summary-card .stat-row { display: flex; gap: 1.5rem; margin-top: 0.5rem; }
      .tab-bar { display: flex; border-bottom: 2px solid #dee2e6; margin-bottom: 1rem; }
      .tab-bar button { padding: 0.5rem 1.2rem; border: none; background: none; cursor: pointer; font-size: 0.9rem; color: #495057; border-bottom: 2px solid transparent; margin-bottom: -2px; }
      .tab-bar button.active { color: #0d6efd; border-bottom-color: #0d6efd; font-weight: 600; }
      .tab-panel { display: none; }
      .tab-panel.active { display: block; }
      .controls { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
      .controls label { font-size: 0.85rem; color: #495057; }
      .controls input, .controls select { padding: 4px 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: 0.85rem; }
      .signal-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
      .signal-table th, .signal-table td { padding: 6px 10px; text-align: left; border-bottom: 1px solid #eee; }
      .signal-table th { background: #f8f9fa; font-weight: 600; color: #495057; position: sticky; top: 0; }
      .signal-table tr:hover { background: #f1f3f5; }
      .badge-conf { display: inline-block; background: #d4edda; color: #155724; padding: 1px 6px; border-radius: 3px; font-size: 0.75rem; }
      .badge-noconf { display: inline-block; background: #f8d7da; color: #721c24; padding: 1px 6px; border-radius: 3px; font-size: 0.75rem; }
      .layer-badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 0.72rem; }
      .layer-dev_valid { background: #cce5ff; color: #004085; }
      .layer-seen_research { background: #e2d9f3; color: #4a148c; }
      .chart-container { width: 100%; height: 420px; margin: 1rem 0; }
      .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1rem; margin-top: 1rem; }
      .stats-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
      .stats-table th, .stats-table td { padding: 5px 8px; border: 1px solid #dee2e6; text-align: right; }
      .stats-table th { background: #f8f9fa; text-align: left; }
      .table-scroll { max-height: 500px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 4px; }
      .loading { text-align: center; padding: 2rem; color: #6c757d; }
      .error-msg { color: #dc3545; padding: 1rem; background: #f8d7da; border-radius: 4px; margin: 1rem 0; }
      .nav-link { display: inline-block; margin-bottom: 1rem; color: #0d6efd; text-decoration: none; font-size: 0.85rem; }
      .nav-link:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="signal-page">
      <a href="/" class="nav-link">&larr; 返回主页</a>
      <div class="signal-header">
        <h1>历史回测信号看板 <span class="research-badge">仅供研究</span></h1>
        <p class="meta" id="header-meta">加载中...</p>
      </div>

      <div id="summary-cards" class="summary-cards">
        <div class="loading">正在加载信号状态...</div>
      </div>

      <div class="tab-bar" id="tab-bar">
        <button class="active" data-tab="daily">日期信号</button>
        <button data-tab="stock">股票搜索</button>
        <button data-tab="backtest">回测统计</button>
      </div>

      <div id="tab-daily" class="tab-panel active">
        <div class="controls">
          <label>日期 <select id="date-select"><option value="">加载中...</option></select></label>
          <label>模型 <select id="model-select"><option value="">全部</option><option value="accuracy_priority">accuracy_priority</option><option value="coverage_priority">coverage_priority</option></select></label>
        </div>
        <div id="daily-table-wrap" class="table-scroll">
          <div class="loading">请选择日期</div>
        </div>
      </div>

      <div id="tab-stock" class="tab-panel">
        <div class="controls">
          <label>股票代码/名称 <input type="text" id="stock-query" placeholder="输入缓存内股票代码或名称" /></label>
          <button id="stock-search-btn" style="padding:4px 12px;border:1px solid #ced4da;border-radius:4px;background:#fff;cursor:pointer;">搜索</button>
        </div>
        <div id="stock-result" class="table-scroll">
          <div class="loading">输入代码或名称后搜索</div>
        </div>
      </div>

      <div id="tab-backtest" class="tab-panel">
        <div id="backtest-chart" class="chart-container"></div>
        <div id="backtest-stats" class="stats-grid"></div>
      </div>
    </div>

    <script src="/static/signals.js?v={{ static_version }}"></script>
  </body>
</html>
